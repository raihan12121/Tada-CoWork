<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Dark Metallic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="50%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(34,211,238,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <rect x="12" y="14" width="104" height="104" rx="26" fill="#00f0ff" opacity="0.15" filter="url(#cyanGlow)"/>

  <!-- Squircle Base -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Internal Subtle Border Accent -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="1"/>

  <!-- Stylized Dual Quantum Slashes -->
  <!-- Left Slash (Cyan) -->
  <polygon points="46,36 56,36 42,92 32,92" fill="url(#cyanGrad)" filter="url(#cyanGlow)"/>
  
  <!-- Right Slash (Pure White with Glow) -->
  <polygon points="76,36 86,36 72,92 62,92" fill="#ffffff" filter="drop-shadow(0 0 4px rgba(255,255,255,0.6))"/>

  <!-- Top Glass Sheen -->
  <path d="M 14,38 Q 64,22 114,38 L 114,14 Q 64,12 14,14 Z" fill="white" opacity="0.06"/>
</svg>
